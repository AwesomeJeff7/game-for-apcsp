<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Movement + Shooting</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#75b7ff, #cbe8ff);
        color: #0f2440;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .wave-banner {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-weight: 700;
        color: #12365f;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(47, 93, 140, 0.35);
        animation: bob 2.2s ease-in-out infinite;
        backdrop-filter: blur(2px);
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-6px);
        }
      }

      .game-shell {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }

      canvas {
        border: 2px solid #2f5d8c;
        background: linear-gradient(#6fb2ff 0%, #89c2ff 45%, #cfe9ff 100%);
        box-shadow: 0 12px 28px rgba(22, 54, 93, 0.25);
      }

      .hint,
      .score {
        margin: 0;
        font-size: 0.95rem;
        color: #17365e;
      }
    </style>
  </head>
  <body>
    <p class="wave-banner" id="wave">Wave 1 · 30s</p>

    <main class="game-shell">
      <canvas id="game" width="640" height="640" aria-label="Shooting game"></canvas>
      <p class="hint">Move: <strong>W A S D</strong> (hold) · Shoot: <strong>Space</strong></p>
      <p class="score" id="score">Enemies on screen: 0</p>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const scoreLabel = document.getElementById("score");
      const waveLabel = document.getElementById("wave");
      const ctx = canvas.getContext("2d");

      const PLAYER_MAX_SPEED = 8.5;
      const PLAYER_ACCEL = 40;
      const PLAYER_FRICTION = 35;
      const PLAYER_SIZE = 28;
      const BULLET_SPEED = 14;
      const WAVE_DURATION = 30;
      const ENEMY_SPEED = 1.7;
      const PLAYER_MAX_HEALTH = 100;

      const DIRECTIONS = {
        up: { dx: 0, dy: -1 },
        left: { dx: -1, dy: 0 },
        down: { dx: 0, dy: 1 },
        right: { dx: 1, dy: 0 },
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        facing: "up",
        color: "#ffcf4a",
      };

      const input = { up: false, left: false, down: false, right: false };
      const bullets = [];
      const enemies = [];
      const clouds = [];
      const stormClouds = [];
      const lightningStrikes = [];

      const waveState = {
        number: 1,
        timeLeft: WAVE_DURATION,
        spawnCooldown: 0.4,
      };

      let lastFrameTime = 0;
      let stormSpawnRollTimer = 0;
      let stormSpawnCooldown = 0;
      let health = PLAYER_MAX_HEALTH;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function createClouds(count) {
        clouds.length = 0;
        for (let i = 0; i < count; i++) {
          clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 14 + Math.random() * 26,
            drift: 5 + Math.random() * 12,
          });
        }
      }

      function spawnEdgeEnemy() {
        const edge = Math.floor(Math.random() * 4);
        let x = 0;
        let y = 0;

        if (edge === 0) {
          x = Math.random() * canvas.width;
          y = -16;
        } else if (edge === 1) {
          x = canvas.width + 16;
          y = Math.random() * canvas.height;
        } else if (edge === 2) {
          x = Math.random() * canvas.width;
          y = canvas.height + 16;
        } else {
          x = -16;
          y = Math.random() * canvas.height;
        }

        enemies.push({ x, y, size: 22, speed: ENEMY_SPEED + waveState.number * 0.07 });
      }

      function drawSkyBackground() {
        for (const cloud of clouds) {
          ctx.fillStyle = "rgba(255,255,255,0.88)";
          ctx.fillRect(cloud.x, cloud.y, cloud.size, cloud.size);
          ctx.fillRect(cloud.x + cloud.size * 0.8, cloud.y + 4, cloud.size * 0.9, cloud.size * 0.9);
          ctx.fillRect(cloud.x + cloud.size * 0.35, cloud.y - cloud.size * 0.35, cloud.size, cloud.size);
        }
      }

      function drawStormClouds() {
        for (const cloud of stormClouds) {
          ctx.fillStyle = "#232733";
          ctx.fillRect(cloud.x, cloud.y, cloud.width, cloud.height);
          ctx.fillRect(cloud.x + cloud.width * 0.68, cloud.y + 5, cloud.width * 0.55, cloud.height * 0.88);
          ctx.fillRect(cloud.x + cloud.width * 0.28, cloud.y - cloud.height * 0.35, cloud.width * 0.7, cloud.height * 0.9);
        }
      }

      function drawLightning() {
        for (const strike of lightningStrikes) {
          const alpha = clamp(strike.life / strike.maxLife, 0, 1);
          ctx.strokeStyle = `rgba(255, 245, 160, ${alpha})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(strike.x, strike.y);
          ctx.lineTo(strike.x + strike.offsetA, strike.y + strike.length * 0.35);
          ctx.lineTo(strike.x + strike.offsetB, strike.y + strike.length * 0.75);
          ctx.lineTo(strike.x + strike.offsetC, strike.y + strike.length);
          ctx.stroke();
        }
      }

      function drawHealthBar() {
        const width = 170;
        const height = 18;
        const x = 14;
        const y = canvas.height - 34;
        const ratio = clamp(health / PLAYER_MAX_HEALTH, 0, 1);

        ctx.fillStyle = "rgba(20, 30, 45, 0.82)";
        ctx.fillRect(x - 4, y - 4, width + 8, height + 8);
        ctx.fillStyle = "rgba(255,255,255,0.14)";
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = ratio > 0.35 ? "#47d27a" : "#ff5a7d";
        ctx.fillRect(x, y, width * ratio, height);
        ctx.strokeStyle = "rgba(255,255,255,0.6)";
        ctx.strokeRect(x, y, width, height);

        ctx.fillStyle = "#ffffff";
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
        ctx.fillText(`Health: ${Math.ceil(health)}/${PLAYER_MAX_HEALTH}`, x + 6, y - 8);
      }

      function drawPlayer() {
        const px = player.x - PLAYER_SIZE / 2;
        const py = player.y - PLAYER_SIZE / 2;

        ctx.fillStyle = player.color;
        ctx.fillRect(px, py, PLAYER_SIZE, PLAYER_SIZE);

        const facing = DIRECTIONS[player.facing];
        ctx.fillStyle = "#0b0f17";
        ctx.fillRect(player.x + facing.dx * 11 - 3, player.y + facing.dy * 11 - 3, 6, 6);
      }

      function drawEnemies() {
        ctx.fillStyle = "#ff5a7d";
        for (const enemy of enemies) {
          ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);
        }
      }

      function drawBullets() {
        ctx.fillStyle = "#62f4ff";
        for (const bullet of bullets) {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateHud() {
        scoreLabel.textContent = `Enemies on screen: ${enemies.length}`;
        waveLabel.textContent = `Wave ${waveState.number} · ${Math.ceil(waveState.timeLeft)}s`;
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSkyBackground();
        drawStormClouds();
        drawLightning();
        drawEnemies();
        drawBullets();
        drawPlayer();
        drawHealthBar();
      }

      function updatePlayer(dt) {
        let inputX = 0;
        let inputY = 0;

        if (input.left) inputX -= 1;
        if (input.right) inputX += 1;
        if (input.up) inputY -= 1;
        if (input.down) inputY += 1;

        let targetVx = 0;
        let targetVy = 0;

        if (inputX !== 0 || inputY !== 0) {
          const length = Math.hypot(inputX, inputY);
          targetVx = (inputX / length) * PLAYER_MAX_SPEED;
          targetVy = (inputY / length) * PLAYER_MAX_SPEED;

          if (Math.abs(inputX) >= Math.abs(inputY)) {
            player.facing = inputX >= 0 ? "right" : "left";
          } else {
            player.facing = inputY >= 0 ? "down" : "up";
          }
        }
@@ -286,73 +339,166 @@
        waveState.spawnCooldown -= dt;

        if (waveState.spawnCooldown <= 0) {
          spawnEdgeEnemy();
          const baseSpawnInterval = Math.max(0.55, 1.4 - waveState.number * 0.05);
          waveState.spawnCooldown = baseSpawnInterval;
        }

        if (waveState.timeLeft <= 0) {
          waveState.number += 1;
          waveState.timeLeft = WAVE_DURATION;
          waveState.spawnCooldown = 0.25;
        }
      }

      function updateClouds(dt) {
        for (const cloud of clouds) {
          cloud.x += cloud.drift * dt;
          if (cloud.x > canvas.width + cloud.size * 2) {
            cloud.x = -cloud.size * 2;
            cloud.y = Math.random() * canvas.height;
          }
        }
      }

      function spawnStormCloud() {
        const fromLeft = Math.random() < 0.5;
        const width = 74 + Math.random() * 24;
        const height = 34 + Math.random() * 8;
        const y = 40 + Math.random() * 140;
        const speed = 26 + Math.random() * 18;

        stormClouds.push({
          x: fromLeft ? -width * 1.4 : canvas.width + width * 0.3,
          y,
          width,
          height,
          vx: fromLeft ? speed : -speed,
          lightningTimer: 3 + Math.random(),
        });
      }

      function updateStormCloudsAndLightning(dt) {
        stormSpawnRollTimer += dt;
        stormSpawnCooldown = Math.max(0, stormSpawnCooldown - dt);

        while (stormSpawnRollTimer >= 1) {
          stormSpawnRollTimer -= 1;
          if (stormSpawnCooldown <= 0 && Math.random() < 1 / 50) {
            spawnStormCloud();
            stormSpawnCooldown = 5;
          }
        }

        for (let i = stormClouds.length - 1; i >= 0; i--) {
          const cloud = stormClouds[i];
          cloud.x += cloud.vx * dt;
          cloud.lightningTimer -= dt;

          if (cloud.lightningTimer <= 0) {
            const strikeX = cloud.x + cloud.width * (0.3 + Math.random() * 0.4);
            const strikeY = cloud.y + cloud.height - 2;
            const strikeLength = 120 + Math.random() * 60;

            lightningStrikes.push({
              x: strikeX,
              y: strikeY,
              length: strikeLength,
              life: 0.22,
              maxLife: 0.22,
              offsetA: (Math.random() - 0.5) * 16,
              offsetB: (Math.random() - 0.5) * 22,
              offsetC: (Math.random() - 0.5) * 26,
              didDamage: false,
            });
            cloud.lightningTimer = 3 + Math.random();
          }

          if (cloud.vx > 0 && cloud.x > canvas.width + cloud.width * 1.5) {
            stormClouds.splice(i, 1);
          } else if (cloud.vx < 0 && cloud.x < -cloud.width * 1.8) {
            stormClouds.splice(i, 1);
          }
        }

        for (let i = lightningStrikes.length - 1; i >= 0; i--) {
          const strike = lightningStrikes[i];
          strike.life -= dt;

          if (!strike.didDamage) {
            const playerLeft = player.x - PLAYER_SIZE / 2;
            const playerRight = player.x + PLAYER_SIZE / 2;
            const playerTop = player.y - PLAYER_SIZE / 2;
            const playerBottom = player.y + PLAYER_SIZE / 2;
            const strikeHalfWidth = 9;
            const strikeLeft = strike.x - strikeHalfWidth;
            const strikeRight = strike.x + strikeHalfWidth;
            const strikeTop = strike.y;
            const strikeBottom = strike.y + strike.length;
            const overlaps =
              playerRight > strikeLeft &&
              playerLeft < strikeRight &&
              playerBottom > strikeTop &&
              playerTop < strikeBottom;

            if (overlaps) {
              health = clamp(health - 14, 0, PLAYER_MAX_HEALTH);
              strike.didDamage = true;
            }
          }

          if (strike.life <= 0) {
            lightningStrikes.splice(i, 1);
          }
        }
      }

      function setKeyState(key, value) {
        if (key === "w") input.up = value;
        if (key === "a") input.left = value;
        if (key === "s") input.down = value;
        if (key === "d") input.right = value;
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (["w", "a", "s", "d", " "].includes(key)) {
          event.preventDefault();
        }

        setKeyState(key, true);
        if (key === " ") shoot();
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        setKeyState(key, false);
      });

      function gameLoop(timestamp) {
        if (lastFrameTime === 0) {
          lastFrameTime = timestamp;
        }

        const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
        lastFrameTime = timestamp;

        updateWave(dt);
        updateClouds(dt);
        updateStormCloudsAndLightning(dt);
        updatePlayer(dt);
        updateEnemies(dt);
        updateBulletsAndHits(dt);
        updateHud();
        render();

        requestAnimationFrame(gameLoop);
      }

      createClouds(22);
      updateHud();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
