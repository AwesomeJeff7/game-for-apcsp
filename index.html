<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Movement + Shooting</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10131a;
        color: #e7ecff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .game-shell {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }

      canvas {
        border: 2px solid #7aa2ff;
        background: #161b24;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .hint,
      .score {
        margin: 0;
        font-size: 0.95rem;
        color: #b7c2e9;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="640" height="640" aria-label="Grid game"></canvas>
      <p class="hint">Move: <strong>W A S D</strong> (hold) · Shoot: <strong>Space</strong></p>
      <p class="score" id="score">Enemies left: 0</p>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const scoreLabel = document.getElementById("score");
      const ctx = canvas.getContext("2d");

      const TILE_SIZE = 40;
      const COLS = canvas.width / TILE_SIZE;
      const ROWS = canvas.height / TILE_SIZE;
      const BULLET_STEP_MS = 90;
      const PLAYER_MAX_SPEED = 8.5;
      const PLAYER_ACCEL = 40;
      const PLAYER_FRICTION = 35;

      const DIRECTIONS = {
        up: { dx: 0, dy: -1 },
        left: { dx: -1, dy: 0 },
        down: { dx: 0, dy: 1 },
        right: { dx: 1, dy: 0 },
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        facing: "up",
        size: TILE_SIZE - 12,
        color: "#ffcf4a",
      };

      const input = { up: false, left: false, down: false, right: false };
      const bullets = [];
      const enemies = [];
      let lastBulletStep = 0;
      let lastFrameTime = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function playerCell() {
        return {
          x: clamp(Math.floor(player.x / TILE_SIZE), 0, COLS - 1),
          y: clamp(Math.floor(player.y / TILE_SIZE), 0, ROWS - 1),
        };
      }

      function cellHasEnemy(x, y) {
        return enemies.some((enemy) => enemy.x === x && enemy.y === y);
      }

      function createEnemies(count) {
        enemies.length = 0;
        while (enemies.length < count) {
          const x = Math.floor(Math.random() * COLS);
          const y = Math.floor(Math.random() * ROWS);
          const cell = playerCell();
          if ((x !== cell.x || y !== cell.y) && !cellHasEnemy(x, y)) {
            enemies.push({ x, y });
          }
        }
      }

      function drawGrid() {
        ctx.strokeStyle = "#2a3242";
        ctx.lineWidth = 1;

        for (let x = 0; x <= canvas.width; x += TILE_SIZE) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }

        for (let y = 0; y <= canvas.height; y += TILE_SIZE) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawPlayer() {
        const size = player.size;
        const px = player.x - size / 2;
        const py = player.y - size / 2;

        ctx.fillStyle = player.color;
        ctx.fillRect(px, py, size, size);

        const facing = DIRECTIONS[player.facing];
        ctx.fillStyle = "#0b0f17";
        ctx.fillRect(
          player.x + facing.dx * 10 - 3,
          player.y + facing.dy * 10 - 3,
          6,
          6,
        );
      }

      function drawEnemies() {
        ctx.fillStyle = "#ff5a7d";
        for (const enemy of enemies) {
          const padding = 9;
          ctx.fillRect(
            enemy.x * TILE_SIZE + padding,
            enemy.y * TILE_SIZE + padding,
            TILE_SIZE - padding * 2,
            TILE_SIZE - padding * 2,
          );
        }
      }

      function drawBullets() {
        ctx.fillStyle = "#62f4ff";
        for (const bullet of bullets) {
          const cx = bullet.x * TILE_SIZE + TILE_SIZE / 2;
          const cy = bullet.y * TILE_SIZE + TILE_SIZE / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateScore() {
        scoreLabel.textContent = `Enemies left: ${enemies.length}`;
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawEnemies();
        drawBullets();
        drawPlayer();
      }

      function updatePlayer(dt) {
        let inputX = 0;
        let inputY = 0;

        if (input.left) inputX -= 1;
        if (input.right) inputX += 1;
        if (input.up) inputY -= 1;
        if (input.down) inputY += 1;

        let targetVx = 0;
        let targetVy = 0;

        if (inputX !== 0 || inputY !== 0) {
          const length = Math.hypot(inputX, inputY);
          targetVx = (inputX / length) * PLAYER_MAX_SPEED;
          targetVy = (inputY / length) * PLAYER_MAX_SPEED;

          if (Math.abs(inputX) >= Math.abs(inputY)) {
            player.facing = inputX >= 0 ? "right" : "left";
          } else {
            player.facing = inputY >= 0 ? "down" : "up";
          }
        }

        const accel = (inputX !== 0 || inputY !== 0 ? PLAYER_ACCEL : PLAYER_FRICTION) * dt;
        const deltaVx = targetVx - player.vx;
        const deltaVy = targetVy - player.vy;
        const deltaMagnitude = Math.hypot(deltaVx, deltaVy);

        if (deltaMagnitude > accel && deltaMagnitude !== 0) {
          player.vx += (deltaVx / deltaMagnitude) * accel;
          player.vy += (deltaVy / deltaMagnitude) * accel;
        } else {
          player.vx = targetVx;
          player.vy = targetVy;
        }

        player.x = clamp(player.x + player.vx, player.size / 2, canvas.width - player.size / 2);
        player.y = clamp(player.y + player.vy, player.size / 2, canvas.height - player.size / 2);
      }

      function shoot() {
        const direction = DIRECTIONS[player.facing];
        const cell = playerCell();
        const startX = cell.x + direction.dx;
        const startY = cell.y + direction.dy;

        if (startX < 0 || startX >= COLS || startY < 0 || startY >= ROWS) {
          return;
        }

        bullets.push({ x: startX, y: startY, dx: direction.dx, dy: direction.dy });
      }

      function advanceBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          const enemyIndex = enemies.findIndex((enemy) => enemy.x === bullet.x && enemy.y === bullet.y);

          if (enemyIndex !== -1) {
            enemies.splice(enemyIndex, 1);
            bullets.splice(i, 1);
            continue;
          }

          bullet.x += bullet.dx;
          bullet.y += bullet.dy;

          if (bullet.x < 0 || bullet.x >= COLS || bullet.y < 0 || bullet.y >= ROWS) {
            bullets.splice(i, 1);
          }
        }
        updateScore();
      }

      function setKeyState(key, value) {
        if (key === "w") input.up = value;
        if (key === "a") input.left = value;
        if (key === "s") input.down = value;
        if (key === "d") input.right = value;
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (["w", "a", "s", "d", " "].includes(key)) {
          event.preventDefault();
        }

        setKeyState(key, true);
        if (key === " ") shoot();
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        setKeyState(key, false);
      });

      function gameLoop(timestamp) {
        if (lastFrameTime === 0) {
          lastFrameTime = timestamp;
        }

        const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
        lastFrameTime = timestamp;

        updatePlayer(dt);

        if (timestamp - lastBulletStep >= BULLET_STEP_MS) {
          advanceBullets();
          lastBulletStep = timestamp;
        }

        render();
        requestAnimationFrame(gameLoop);
      }

      createEnemies(14);
      updateScore();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
