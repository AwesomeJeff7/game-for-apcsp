<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Movement + Shooting</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#75b7ff, #cbe8ff);
        color: #0f2440;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .wave-banner {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-weight: 700;
        color: #12365f;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(47, 93, 140, 0.35);
        animation: bob 2.2s ease-in-out infinite;
        backdrop-filter: blur(2px);
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-6px);
        }
      }

      .game-shell {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }

      canvas {
        border: 2px solid #2f5d8c;
        background: linear-gradient(#6fb2ff 0%, #89c2ff 45%, #cfe9ff 100%);
        box-shadow: 0 12px 28px rgba(22, 54, 93, 0.25);
      }

      .hint,
      .score {
        margin: 0;
        font-size: 0.95rem;
        color: #17365e;
      }
    </style>
  </head>
  <body>
    <p class="wave-banner" id="wave">Wave 1 · 30s</p>

    <main class="game-shell">
      <canvas id="game" width="640" height="640" aria-label="Shooting game"></canvas>
      <p class="hint">Move: <strong>W A S D</strong> (hold) · Shoot: <strong>Space</strong></p>
      <p class="score" id="score">Enemies on screen: 0</p>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const scoreLabel = document.getElementById("score");
      const waveLabel = document.getElementById("wave");
      const ctx = canvas.getContext("2d");

      const PLAYER_MAX_SPEED = 8.5;
      const PLAYER_ACCEL = 40;
      const PLAYER_FRICTION = 35;
      const PLAYER_SIZE = 28;
      const BULLET_SPEED = 10;
      const SHOT_INTERVAL = 0.11;
      const WAVE_DURATION = 30;
      const ENEMY_SPEED = 1.7;
      const PLAYER_MAX_HEALTH = 100;
      const ENEMY_CONTACT_DAMAGE = 18;
      const ENEMY_DAMAGE_COOLDOWN = 0.55;
      const HIT_FLASH_DURATION = 0.22;
      const BULLET_BASE_DAMAGE = 1;

      const DIRECTIONS = {
        up: { dx: 0, dy: -1 },
        left: { dx: -1, dy: 0 },
        down: { dx: 0, dy: 1 },
        right: { dx: 1, dy: 0 },
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        facing: "up",
        aimDx: 0,
        aimDy: -1,
        color: "#ffcf4a",
      };

      const input = { up: false, left: false, down: false, right: false, shoot: false };
      const bullets = [];
      const enemies = [];
      const clouds = [];

      const waveState = {
        number: 1,
        timeLeft: WAVE_DURATION,
        spawnCooldown: 0.4,
      };

      const playerStats = {
        bulletDamage: BULLET_BASE_DAMAGE,
        bulletSpeedMultiplier: 1,
        shotMode: 1, // 1=single, 2=double, 3=triple, 8=all directions
      };

      const upgradeMenu = {
        active: false,
        cards: [],
        hoveredIndex: -1,
      };

      let lastFrameTime = 0;
      let health = PLAYER_MAX_HEALTH;
      let enemyDamageCooldown = 0;
      let healthFlashTimer = 0;
      let shootCooldown = 0;
      const endScreenButton = {
        width: 190,
        height: 46,
      };
      const upgradeCard = {
        width: 170,
        height: 220,
        gap: 22,
        y: 200,
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function createClouds(count) {
        clouds.length = 0;
        for (let i = 0; i < count; i++) {
          clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 14 + Math.random() * 26,
            drift: 5 + Math.random() * 12,
          });
        }
      }

      function spawnEdgeEnemy() {
        const edge = Math.floor(Math.random() * 4);
        let x = 0;
        let y = 0;

        if (edge === 0) {
          x = Math.random() * canvas.width;
          y = -16;
        } else if (edge === 1) {
          x = canvas.width + 16;
          y = Math.random() * canvas.height;
        } else if (edge === 2) {
          x = Math.random() * canvas.width;
          y = canvas.height + 16;
        } else {
          x = -16;
          y = Math.random() * canvas.height;
        }

        const enemyHealth = 1 + Math.floor((waveState.number - 1) / 2);
        enemies.push({ x, y, size: 22, speed: ENEMY_SPEED + waveState.number * 0.07, hp: enemyHealth });
      }

      function rotateVector(dx, dy, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return { dx: dx * cos - dy * sin, dy: dx * sin + dy * cos };
      }

      function getShotVectors() {
        const base = { dx: player.aimDx, dy: player.aimDy };
        if (playerStats.shotMode === 2) {
          return [base, { dx: -base.dx, dy: -base.dy }];
        }
        if (playerStats.shotMode === 3) {
          return [base, rotateVector(base.dx, base.dy, Math.PI / 7), rotateVector(base.dx, base.dy, -Math.PI / 7)];
        }
        if (playerStats.shotMode === 8) {
          const vectors = [];
          for (let i = 0; i < 8; i++) {
            vectors.push(rotateVector(1, 0, (Math.PI * 2 * i) / 8));
          }
          return vectors;
        }
        return [base];
      }

      function getUpgradePool() {
        const pool = [
          {
            key: "damage",
            title: "Damage +1",
            description: "Bullets hit harder.",
            apply: () => {
              playerStats.bulletDamage += 1;
            },
          },
          {
            key: "bulletSpeed",
            title: "Bullet Speed +20%",
            description: "Shots travel faster.",
            apply: () => {
              playerStats.bulletSpeedMultiplier *= 1.2;
            },
          },
          {
            key: "heal",
            title: "Heal +30",
            description: "Restore your HP.",
            apply: () => {
              health = clamp(health + 30, 0, PLAYER_MAX_HEALTH);
            },
          },
        ];

        if (playerStats.shotMode < 2) {
          pool.push({
            key: "shot2",
            title: "2-Way Shot",
            description: "Fire forward + backward.",
            apply: () => {
              playerStats.shotMode = 2;
            },
          });
        } else if (playerStats.shotMode === 2) {
          pool.push({
            key: "shot3",
            title: "3-Way Shot",
            description: "Spread into three shots.",
            apply: () => {
              playerStats.shotMode = 3;
            },
          });
        } else if (playerStats.shotMode >= 3 && playerStats.shotMode < 8) {
          pool.push({
            key: "shot8",
            title: "All-Directions",
            description: "Blast in all directions.",
            apply: () => {
              playerStats.shotMode = 8;
            },
          });
        }

        return pool;
      }

      function beginUpgradeSelection() {
        const pool = [...getUpgradePool()];
        const cards = [];
        while (cards.length < 3 && pool.length > 0) {
          const index = Math.floor(Math.random() * pool.length);
          cards.push(pool.splice(index, 1)[0]);
        }
        upgradeMenu.cards = cards;
        upgradeMenu.active = true;
        upgradeMenu.hoveredIndex = -1;
      }

      function chooseUpgrade(index) {
        const chosen = upgradeMenu.cards[index];
        if (!chosen) return;
        chosen.apply();
        upgradeMenu.active = false;
        upgradeMenu.cards = [];
        upgradeMenu.hoveredIndex = -1;
        waveState.number += 1;
        waveState.timeLeft = WAVE_DURATION;
        waveState.spawnCooldown = 0.25;
        updateHud();
      }

      function getUpgradeCardIndexAt(clickX, clickY, now = performance.now()) {
        const totalWidth = upgradeCard.width * 3 + upgradeCard.gap * 2;
        const startX = (canvas.width - totalWidth) / 2;
        const baseY = upgradeCard.y;
        for (let i = 0; i < upgradeMenu.cards.length; i++) {
          const x = startX + i * (upgradeCard.width + upgradeCard.gap);
          const isHovered = upgradeMenu.hoveredIndex === i;
          const bobOffset = isHovered ? Math.sin(now * 0.01) * 6 - 8 : 0;
          const y = baseY + bobOffset;
          const inside = clickX >= x && clickX <= x + upgradeCard.width && clickY >= y && clickY <= y + upgradeCard.height;
          if (inside) return i;
        }
        return -1;
      }

      function drawSkyBackground() {
        for (const cloud of clouds) {
          ctx.fillStyle = "rgba(255,255,255,0.88)";
          ctx.fillRect(cloud.x, cloud.y, cloud.size, cloud.size);
          ctx.fillRect(cloud.x + cloud.size * 0.8, cloud.y + 4, cloud.size * 0.9, cloud.size * 0.9);
          ctx.fillRect(cloud.x + cloud.size * 0.35, cloud.y - cloud.size * 0.35, cloud.size, cloud.size);
        }
      }

      function drawPlayer() {
        const px = player.x - PLAYER_SIZE / 2;
        const py = player.y - PLAYER_SIZE / 2;
        const flashStrength = clamp(healthFlashTimer / HIT_FLASH_DURATION, 0, 1);

        ctx.fillStyle = player.color;
        ctx.fillRect(px, py, PLAYER_SIZE, PLAYER_SIZE);

        if (flashStrength > 0) {
          const pulse = 0.35 + Math.sin(performance.now() * 0.05) * 0.25;
          ctx.fillStyle = `rgba(255,255,255,${clamp(pulse * flashStrength, 0, 0.8)})`;
          ctx.fillRect(px, py, PLAYER_SIZE, PLAYER_SIZE);
        }

        const facing = DIRECTIONS[player.facing];
        ctx.fillStyle = "#0b0f17";
        ctx.fillRect(player.x + facing.dx * 11 - 3, player.y + facing.dy * 11 - 3, 6, 6);
      }

      function drawEnemies() {
        for (const enemy of enemies) {
          const hurtTone = clamp(enemy.hp / 5, 0.2, 1);
          ctx.fillStyle = `rgba(255, ${Math.round(70 + 40 * hurtTone)}, ${Math.round(100 + 25 * hurtTone)}, 1)`;
          ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);
          if (enemy.hp > 1) {
            ctx.fillStyle = "#fff";
            ctx.font = "11px system-ui, sans-serif";
            ctx.fillText(`${enemy.hp}`, enemy.x - 3, enemy.y + 4);
          }
        }
      }

      function drawBullets() {
        ctx.fillStyle = "#62f4ff";
        for (const bullet of bullets) {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawHealthBar() {
        const barWidth = 190;
        const barHeight = 18;
        const x = 14;
        const y = canvas.height - 34;
        const hpRatio = clamp(health / PLAYER_MAX_HEALTH, 0, 1);
        const flashStrength = clamp(healthFlashTimer / HIT_FLASH_DURATION, 0, 1);

        ctx.fillStyle = "rgba(12, 21, 34, 0.8)";
        ctx.fillRect(x - 5, y - 5, barWidth + 10, barHeight + 10);

        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        ctx.fillRect(x, y, barWidth, barHeight);

        const r = Math.round(235 - hpRatio * 130);
        const g = Math.round(85 + hpRatio * 135);
        ctx.fillStyle = `rgb(${r}, ${g}, 90)`;
        ctx.fillRect(x, y, barWidth * hpRatio, barHeight);

        if (flashStrength > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${0.45 * flashStrength})`;
          ctx.fillRect(x, y, barWidth, barHeight);
        }

        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.strokeRect(x, y, barWidth, barHeight);

        ctx.fillStyle = "#ffffff";
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
        ctx.fillText(`HP ${Math.ceil(health)} / ${PLAYER_MAX_HEALTH}`, x + 6, y - 8);
      }

      function drawUpgradeMenu() {
        if (!upgradeMenu.active) return;
        const totalWidth = upgradeCard.width * 3 + upgradeCard.gap * 2;
        const startX = (canvas.width - totalWidth) / 2;
        const y = upgradeCard.y;

        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "700 24px system-ui, sans-serif";
        ctx.fillText(`Wave ${waveState.number} Clear! Pick an upgrade`, canvas.width / 2, 130);

        upgradeMenu.cards.forEach((card, index) => {
          const x = startX + index * (upgradeCard.width + upgradeCard.gap);
          const isHovered = upgradeMenu.hoveredIndex === index;
          const bobOffset = isHovered ? Math.sin(performance.now() * 0.01) * 6 - 8 : 0;
          const cardY = y + bobOffset;
          ctx.fillStyle = "rgba(20, 40, 62, 0.95)";
          ctx.fillRect(x, cardY, upgradeCard.width, upgradeCard.height);
          ctx.strokeStyle = isHovered ? "rgba(175, 245, 255, 1)" : "rgba(125, 218, 255, 0.95)";
          ctx.lineWidth = isHovered ? 3 : 2;
          ctx.strokeRect(x, cardY, upgradeCard.width, upgradeCard.height);

          ctx.fillStyle = "#9be6ff";
          ctx.font = "700 18px system-ui, sans-serif";
          ctx.fillText(card.title, x + upgradeCard.width / 2, cardY + 42);
          ctx.fillStyle = "#e9f6ff";
          ctx.font = "14px system-ui, sans-serif";
          ctx.fillText(card.description, x + upgradeCard.width / 2, cardY + 82);
          ctx.fillStyle = "#8de39a";
          ctx.font = "700 13px system-ui, sans-serif";
          ctx.fillText("Click to choose", x + upgradeCard.width / 2, cardY + upgradeCard.height - 18);
        });
        ctx.textAlign = "left";
      }

      function updateHud() {
        scoreLabel.textContent = `Enemies on screen: ${enemies.length}`;
        waveLabel.textContent = `Wave ${waveState.number} · ${Math.ceil(waveState.timeLeft)}s`;
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSkyBackground();
        drawEnemies();
        drawBullets();
        drawPlayer();
        drawHealthBar();
        drawUpgradeMenu();

        if (health <= 0) {
          const buttonX = canvas.width / 2 - endScreenButton.width / 2;
          const buttonY = canvas.height / 2 + 44;
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.font = "700 38px system-ui, sans-serif";
          ctx.fillText("You got zapped", canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = "500 18px system-ui, sans-serif";
          ctx.fillText("Try again?", canvas.width / 2, canvas.height / 2 + 24);

          ctx.fillStyle = "#47d27a";
          ctx.fillRect(buttonX, buttonY, endScreenButton.width, endScreenButton.height);
          ctx.strokeStyle = "rgba(255,255,255,0.85)";
          ctx.strokeRect(buttonX, buttonY, endScreenButton.width, endScreenButton.height);
          ctx.fillStyle = "#10361e";
          ctx.font = "700 20px system-ui, sans-serif";
          ctx.fillText("Restart", canvas.width / 2, buttonY + 30);
          ctx.textAlign = "left";
        }
      }

      function updatePlayer(dt) {
        let inputX = 0;
        let inputY = 0;

        if (input.left) inputX -= 1;
        if (input.right) inputX += 1;
        if (input.up) inputY -= 1;
        if (input.down) inputY += 1;

        let targetVx = 0;
        let targetVy = 0;

        if (inputX !== 0 || inputY !== 0) {
          const length = Math.hypot(inputX, inputY);
          targetVx = (inputX / length) * PLAYER_MAX_SPEED;
          targetVy = (inputY / length) * PLAYER_MAX_SPEED;
          player.aimDx = inputX / length;
          player.aimDy = inputY / length;

          if (Math.abs(inputX) >= Math.abs(inputY)) {
            player.facing = inputX >= 0 ? "right" : "left";
          } else {
            player.facing = inputY >= 0 ? "down" : "up";
          }
        }

        const accel = (inputX !== 0 || inputY !== 0 ? PLAYER_ACCEL : PLAYER_FRICTION) * dt;
        const deltaVx = targetVx - player.vx;
        const deltaVy = targetVy - player.vy;
        const deltaMagnitude = Math.hypot(deltaVx, deltaVy);

        if (deltaMagnitude > accel && deltaMagnitude !== 0) {
          player.vx += (deltaVx / deltaMagnitude) * accel;
          player.vy += (deltaVy / deltaMagnitude) * accel;
        } else {
          player.vx = targetVx;
          player.vy = targetVy;
        }

        player.x = clamp(player.x + player.vx * dt * 60, PLAYER_SIZE / 2, canvas.width - PLAYER_SIZE / 2);
        player.y = clamp(player.y + player.vy * dt * 60, PLAYER_SIZE / 2, canvas.height - PLAYER_SIZE / 2);
      }

      function takeDamage(amount) {
        health = clamp(health - amount, 0, PLAYER_MAX_HEALTH);
        healthFlashTimer = HIT_FLASH_DURATION;
      }

      function updateEnemies(dt) {
        for (const enemy of enemies) {
          const dx = player.x - enemy.x;
          const dy = player.y - enemy.y;
          const distance = Math.hypot(dx, dy) || 1;
          enemy.x += (dx / distance) * enemy.speed * dt * 60;
          enemy.y += (dy / distance) * enemy.speed * dt * 60;
        }

        enemyDamageCooldown = Math.max(0, enemyDamageCooldown - dt);
        const touchingEnemy = enemies.some((enemy) => Math.hypot(player.x - enemy.x, player.y - enemy.y) < enemy.size / 2 + PLAYER_SIZE / 2 - 2);
        if (touchingEnemy && enemyDamageCooldown <= 0) {
          takeDamage(ENEMY_CONTACT_DAMAGE);
          enemyDamageCooldown = ENEMY_DAMAGE_COOLDOWN;
        }
      }

      function shoot() {
        for (const direction of getShotVectors()) {
          bullets.push({
            x: player.x + direction.dx * (PLAYER_SIZE / 2 + 8),
            y: player.y + direction.dy * (PLAYER_SIZE / 2 + 8),
            vx: direction.dx * BULLET_SPEED * playerStats.bulletSpeedMultiplier,
            vy: direction.dy * BULLET_SPEED * playerStats.bulletSpeedMultiplier,
            damage: playerStats.bulletDamage,
          });
        }
      }

      function updateShooting(dt) {
        shootCooldown = Math.max(0, shootCooldown - dt);
        if (input.shoot && shootCooldown <= 0 && health > 0) {
          shoot();
          shootCooldown = SHOT_INTERVAL;
        }
      }

      function updateBulletsAndHits(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          bullet.x += bullet.vx * dt * 60;
          bullet.y += bullet.vy * dt * 60;

          if (bullet.x < -8 || bullet.x > canvas.width + 8 || bullet.y < -8 || bullet.y > canvas.height + 8) {
            bullets.splice(i, 1);
            continue;
          }

          const enemyIndex = enemies.findIndex((enemy) => Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < enemy.size / 2 + 4);
          if (enemyIndex !== -1) {
            enemies[enemyIndex].hp -= bullet.damage || BULLET_BASE_DAMAGE;
            if (enemies[enemyIndex].hp <= 0) {
              enemies.splice(enemyIndex, 1);
            }
            bullets.splice(i, 1);
          }
        }
      }

      function updateWave(dt) {
        if (upgradeMenu.active) return;
        waveState.timeLeft -= dt;
        waveState.spawnCooldown -= dt;

        if (waveState.spawnCooldown <= 0) {
          spawnEdgeEnemy();
          const baseSpawnInterval = Math.max(0.55, 1.4 - waveState.number * 0.05);
          waveState.spawnCooldown = baseSpawnInterval;
        }

        if (waveState.timeLeft <= 0) {
          beginUpgradeSelection();
        }
      }

      function updateClouds(dt) {
        for (const cloud of clouds) {
          cloud.x += cloud.drift * dt;
          if (cloud.x > canvas.width + cloud.size * 2) {
            cloud.x = -cloud.size * 2;
            cloud.y = Math.random() * canvas.height;
          }
        }
      }

      function setKeyState(key, value) {
        if (key === "w") input.up = value;
        if (key === "a") input.left = value;
        if (key === "s") input.down = value;
        if (key === "d") input.right = value;
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (["w", "a", "s", "d", " "].includes(key)) {
          event.preventDefault();
        }

        setKeyState(key, true);
        if (key === " ") {
          if (upgradeMenu.active) return;
          input.shoot = true;
          shootCooldown = 0;
          updateShooting(0);
        }
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        setKeyState(key, false);
        if (key === " ") {
          input.shoot = false;
        }
      });

      canvas.addEventListener("mousemove", (event) => {
        if (!upgradeMenu.active) {
          upgradeMenu.hoveredIndex = -1;
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;
        upgradeMenu.hoveredIndex = getUpgradeCardIndexAt(mouseX, mouseY);
      });

      canvas.addEventListener("click", (event) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;

        if (upgradeMenu.active) {
          const clickedIndex = getUpgradeCardIndexAt(clickX, clickY);
          if (clickedIndex !== -1) {
            chooseUpgrade(clickedIndex);
            return;
          }
        }

        if (health > 0) return;
        const buttonX = canvas.width / 2 - endScreenButton.width / 2;
        const buttonY = canvas.height / 2 + 44;
        const clickedRestart =
          clickX >= buttonX &&
          clickX <= buttonX + endScreenButton.width &&
          clickY >= buttonY &&
          clickY <= buttonY + endScreenButton.height;

        if (clickedRestart) {
          restartGame();
        }
      });

      function restartGame() {
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        player.vx = 0;
        player.vy = 0;
        player.facing = "up";
        player.aimDx = 0;
        player.aimDy = -1;
        health = PLAYER_MAX_HEALTH;
        healthFlashTimer = 0;
        enemyDamageCooldown = 0;
        shootCooldown = 0;
        input.shoot = false;
        bullets.length = 0;
        enemies.length = 0;
        upgradeMenu.active = false;
        upgradeMenu.cards = [];
        playerStats.bulletDamage = BULLET_BASE_DAMAGE;
        playerStats.bulletSpeedMultiplier = 1;
        playerStats.shotMode = 1;
        waveState.number = 1;
        waveState.timeLeft = WAVE_DURATION;
        waveState.spawnCooldown = 0.25;
        spawnEdgeEnemy();
        updateHud();
      }

      function gameLoop(timestamp) {
        if (lastFrameTime === 0) {
          lastFrameTime = timestamp;
        }

        const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
        lastFrameTime = timestamp;

        healthFlashTimer = Math.max(0, healthFlashTimer - dt);

        if (health > 0 && !upgradeMenu.active) {
          updateWave(dt);
          updateClouds(dt);
          updatePlayer(dt);
          updateEnemies(dt);
          updateShooting(dt);
          updateBulletsAndHits(dt);
          updateHud();
        }
        render();

        requestAnimationFrame(gameLoop);
      }

      createClouds(22);
      spawnEdgeEnemy();
      updateHud();
