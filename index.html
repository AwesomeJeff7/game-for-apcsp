<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Movement + Shooting</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#75b7ff, #cbe8ff);
        color: #0f2440;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .wave-banner {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-weight: 700;
        color: #12365f;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(47, 93, 140, 0.35);
        animation: bob 2.2s ease-in-out infinite;
        backdrop-filter: blur(2px);
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-6px);
        }
      }

      .game-shell {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }

      canvas {
        border: 2px solid #2f5d8c;
        background: linear-gradient(#6fb2ff 0%, #89c2ff 45%, #cfe9ff 100%);
        box-shadow: 0 12px 28px rgba(22, 54, 93, 0.25);
      }

      .hint,
      .score {
        margin: 0;
        font-size: 0.95rem;
        color: #17365e;
      }
    </style>
  </head>
  <body>
    <p class="wave-banner" id="wave">Wave 1 · 30s</p>

    <main class="game-shell">
      <canvas id="game" width="640" height="640" aria-label="Shooting game"></canvas>
      <p class="hint">Move: <strong>W A S D</strong> (hold) · Shoot: <strong>Space</strong></p>
      <p class="score" id="score">Enemies on screen: 0</p>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const scoreLabel = document.getElementById("score");
      const waveLabel = document.getElementById("wave");
      const ctx = canvas.getContext("2d");

      const PLAYER_MAX_SPEED = 8.5;
      const PLAYER_ACCEL = 40;
      const PLAYER_FRICTION = 35;
      const PLAYER_SIZE = 28;
      const BULLET_SPEED = 14;
      const WAVE_DURATION = 30;
      const ENEMY_SPEED = 1.7;

      const DIRECTIONS = {
        up: { dx: 0, dy: -1 },
        left: { dx: -1, dy: 0 },
        down: { dx: 0, dy: 1 },
        right: { dx: 1, dy: 0 },
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        facing: "up",
        color: "#ffcf4a",
      };

      const input = { up: false, left: false, down: false, right: false };
      const bullets = [];
      const enemies = [];
      const clouds = [];

      const waveState = {
        number: 1,
        timeLeft: WAVE_DURATION,
        spawnCooldown: 0.4,
      };

      let lastFrameTime = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function createClouds(count) {
        clouds.length = 0;
        for (let i = 0; i < count; i++) {
          clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 14 + Math.random() * 26,
            drift: 5 + Math.random() * 12,
          });
        }
      }

      function spawnEdgeEnemy() {
        const edge = Math.floor(Math.random() * 4);
        let x = 0;
        let y = 0;

        if (edge === 0) {
          x = Math.random() * canvas.width;
          y = -16;
        } else if (edge === 1) {
          x = canvas.width + 16;
          y = Math.random() * canvas.height;
        } else if (edge === 2) {
          x = Math.random() * canvas.width;
          y = canvas.height + 16;
        } else {
          x = -16;
          y = Math.random() * canvas.height;
        }

        enemies.push({ x, y, size: 22, speed: ENEMY_SPEED + waveState.number * 0.07 });
      }

      function drawSkyBackground() {
        for (const cloud of clouds) {
          ctx.fillStyle = "rgba(255,255,255,0.88)";
          ctx.fillRect(cloud.x, cloud.y, cloud.size, cloud.size);
          ctx.fillRect(cloud.x + cloud.size * 0.8, cloud.y + 4, cloud.size * 0.9, cloud.size * 0.9);
          ctx.fillRect(cloud.x + cloud.size * 0.35, cloud.y - cloud.size * 0.35, cloud.size, cloud.size);
        }
      }

      function drawPlayer() {
        const px = player.x - PLAYER_SIZE / 2;
        const py = player.y - PLAYER_SIZE / 2;

        ctx.fillStyle = player.color;
        ctx.fillRect(px, py, PLAYER_SIZE, PLAYER_SIZE);

        const facing = DIRECTIONS[player.facing];
        ctx.fillStyle = "#0b0f17";
        ctx.fillRect(player.x + facing.dx * 11 - 3, player.y + facing.dy * 11 - 3, 6, 6);
      }

      function drawEnemies() {
        ctx.fillStyle = "#ff5a7d";
        for (const enemy of enemies) {
          ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);
        }
      }

      function drawBullets() {
        ctx.fillStyle = "#62f4ff";
        for (const bullet of bullets) {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateHud() {
        scoreLabel.textContent = `Enemies on screen: ${enemies.length}`;
        waveLabel.textContent = `Wave ${waveState.number} · ${Math.ceil(waveState.timeLeft)}s`;
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSkyBackground();
        drawEnemies();
        drawBullets();
        drawPlayer();
      }

      function updatePlayer(dt) {
        let inputX = 0;
        let inputY = 0;

        if (input.left) inputX -= 1;
        if (input.right) inputX += 1;
        if (input.up) inputY -= 1;
        if (input.down) inputY += 1;

        let targetVx = 0;
        let targetVy = 0;

        if (inputX !== 0 || inputY !== 0) {
          const length = Math.hypot(inputX, inputY);
          targetVx = (inputX / length) * PLAYER_MAX_SPEED;
          targetVy = (inputY / length) * PLAYER_MAX_SPEED;

          if (Math.abs(inputX) >= Math.abs(inputY)) {
            player.facing = inputX >= 0 ? "right" : "left";
          } else {
            player.facing = inputY >= 0 ? "down" : "up";
          }
        }

        const accel = (inputX !== 0 || inputY !== 0 ? PLAYER_ACCEL : PLAYER_FRICTION) * dt;
        const deltaVx = targetVx - player.vx;
        const deltaVy = targetVy - player.vy;
        const deltaMagnitude = Math.hypot(deltaVx, deltaVy);

        if (deltaMagnitude > accel && deltaMagnitude !== 0) {
          player.vx += (deltaVx / deltaMagnitude) * accel;
          player.vy += (deltaVy / deltaMagnitude) * accel;
        } else {
          player.vx = targetVx;
          player.vy = targetVy;
        }

        player.x = clamp(player.x + player.vx, PLAYER_SIZE / 2, canvas.width - PLAYER_SIZE / 2);
        player.y = clamp(player.y + player.vy, PLAYER_SIZE / 2, canvas.height - PLAYER_SIZE / 2);
      }

      function updateEnemies(dt) {
        for (const enemy of enemies) {
          const dx = player.x - enemy.x;
          const dy = player.y - enemy.y;
          const distance = Math.hypot(dx, dy) || 1;
          enemy.x += (dx / distance) * enemy.speed * dt * 60;
          enemy.y += (dy / distance) * enemy.speed * dt * 60;
        }
      }

      function shoot() {
        const direction = DIRECTIONS[player.facing];
        bullets.push({
          x: player.x + direction.dx * (PLAYER_SIZE / 2 + 8),
          y: player.y + direction.dy * (PLAYER_SIZE / 2 + 8),
          vx: direction.dx * BULLET_SPEED,
          vy: direction.dy * BULLET_SPEED,
        });
      }

      function updateBulletsAndHits(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          bullet.x += bullet.vx * dt * 60;
          bullet.y += bullet.vy * dt * 60;

          if (bullet.x < -8 || bullet.x > canvas.width + 8 || bullet.y < -8 || bullet.y > canvas.height + 8) {
            bullets.splice(i, 1);
            continue;
          }

          const enemyIndex = enemies.findIndex((enemy) => Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < enemy.size / 2 + 4);
          if (enemyIndex !== -1) {
            enemies.splice(enemyIndex, 1);
            bullets.splice(i, 1);
          }
        }
      }

      function updateWave(dt) {
        waveState.timeLeft -= dt;
        waveState.spawnCooldown -= dt;

        if (waveState.spawnCooldown <= 0) {
          spawnEdgeEnemy();
          const baseSpawnInterval = Math.max(0.55, 1.4 - waveState.number * 0.05);
          waveState.spawnCooldown = baseSpawnInterval;
        }

        if (waveState.timeLeft <= 0) {
          waveState.number += 1;
          waveState.timeLeft = WAVE_DURATION;
          waveState.spawnCooldown = 0.25;
        }
      }

      function updateClouds(dt) {
        for (const cloud of clouds) {
          cloud.x += cloud.drift * dt;
          if (cloud.x > canvas.width + cloud.size * 2) {
            cloud.x = -cloud.size * 2;
            cloud.y = Math.random() * canvas.height;
          }
        }
      }

      function setKeyState(key, value) {
        if (key === "w") input.up = value;
        if (key === "a") input.left = value;
        if (key === "s") input.down = value;
        if (key === "d") input.right = value;
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (["w", "a", "s", "d", " "].includes(key)) {
          event.preventDefault();
        }

        setKeyState(key, true);
        if (key === " ") shoot();
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        setKeyState(key, false);
      });

      function gameLoop(timestamp) {
        if (lastFrameTime === 0) {
          lastFrameTime = timestamp;
        }

        const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
        lastFrameTime = timestamp;

        updateWave(dt);
        updateClouds(dt);
        updatePlayer(dt);
        updateEnemies(dt);
        updateBulletsAndHits(dt);
        updateHud();
        render();

        requestAnimationFrame(gameLoop);
      }

      createClouds(22);
      updateHud();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
